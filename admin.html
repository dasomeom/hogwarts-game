<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어드민 — 해리포터와 새누리의 비밀</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #8BA4D4; --gold-lt: #C0D4F0; --parchment: #D8E4F5;
    --ink: #0A0F1A; --deep: #050308; --stone: #0C1020;
    --font-d: 'Cinzel', serif; --font-b: 'Crimson Text', Georgia, serif;
  }
  body { background: var(--deep); color: var(--parchment); font-family: var(--font-b); min-height: 100vh; }

  /* ── 로그인 ── */
  #loginOverlay { position: fixed; inset: 0; background: var(--deep); z-index: 100; display: flex; align-items: center; justify-content: center; }
  .login-box { background: #0C1020; border: 1px solid rgba(140,164,212,0.25); border-radius: 4px; padding: 2.5rem 2rem; width: 320px; text-align: center; }
  .login-box h2 { font-family: var(--font-d); font-size: 0.9rem; color: var(--gold); letter-spacing: 0.2em; margin-bottom: 1.5rem; }

  input[type="password"], input[type="text"], input[type="number"], select {
    width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(140,164,212,0.25); border-radius: 3px;
    padding: 0.75rem 1rem; color: var(--parchment); font-family: var(--font-b); font-size: 1rem; outline: none;
    transition: border-color 0.2s; margin-bottom: 0.8rem;
  }
  input:focus, select:focus { border-color: rgba(140,164,212,0.6); }
  #loginErr { color: #ff6b6b; font-size: 0.85rem; font-style: italic; min-height: 1.2em; margin-top: 0.3rem; }

  .btn { font-family: var(--font-d); font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; border: none; border-radius: 3px; padding: 0.75rem 1.4rem; cursor: pointer; transition: filter 0.2s; }
  .btn:hover { filter: brightness(1.15); }
  .btn-gold { background: linear-gradient(135deg, #1A2D52, #2A3F6A, #1A2D52); color: #C0D4F0; font-weight: 700; border: 1px solid rgba(140,164,212,0.3); }
  .btn-ghost { background: transparent; border: 1px solid rgba(140,164,212,0.3); color: var(--gold); }
  .btn-danger { background: #3A1010; border: 1px solid rgba(180,60,60,0.4); color: #ff9999; }
  .btn-green { background: #0e2a1a; color: #7ed87e; border: 1px solid #1a5c2a; }
  .btn-block { width: 100%; }
  .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.6rem; }

  /* ── 헤더 ── */
  header {
    background: linear-gradient(180deg, #080C18, #050308);
    border-bottom: 1px solid rgba(140,164,212,0.2);
    padding: 0.9rem 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem;
  }
  header h1 { font-family: var(--font-d); font-size: 0.95rem; color: var(--gold-lt); letter-spacing: 0.1em; }
  #adminTimer { font-family: var(--font-d); font-size: 1.6rem; color: var(--gold); text-shadow: 0 0 15px rgba(140,164,212,0.4); }
  #adminTimer.urgent { color: #ff6b6b; }

  /* ── 레이아웃 ── */
  .page { padding: 1.2rem 1.5rem 4rem; max-width: 1100px; margin: 0 auto; }
  .section-label { font-family: var(--font-d); font-size: 0.58rem; letter-spacing: 0.22em; color: var(--gold); opacity: 0.5; text-transform: uppercase; margin: 1.8rem 0 0.8rem; }

  /* ── 게임 컨트롤 ── */
  .ctrl-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .ctrl-card { background: #0C1020; border: 1px solid rgba(140,164,212,0.15); border-radius: 4px; padding: 1.2rem; flex: 1; min-width: 140px; text-align: center; }
  .ctrl-card h3 { font-family: var(--font-d); font-size: 0.58rem; letter-spacing: 0.12em; color: var(--gold); opacity: 0.6; text-transform: uppercase; margin-bottom: 0.6rem; }
  .ctrl-card .big { font-family: var(--font-d); font-size: 1.8rem; color: var(--gold-lt); margin-bottom: 0.5rem; }

  /* ── 팀 그리드 ── */
  .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0.8rem; }
  .team-card {
    background: #0C1020; border: 1px solid rgba(140,164,212,0.12); border-radius: 4px; padding: 1rem 1.1rem;
    transition: border-color 0.2s;
  }
  .team-card.finished { border-color: rgba(100,200,100,0.3); }
  .team-card.finished .team-card-header { opacity: 0.8; }

  .team-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.7rem; }
  .team-card-name { font-family: var(--font-d); font-size: 0.78rem; color: var(--gold-lt); }
  .team-card-house { font-size: 0.75rem; opacity: 0.5; font-style: italic; }
  .team-card-score { font-family: var(--font-d); font-size: 1.3rem; color: var(--gold); }

  /* 진행 도트 */
  .station-dots { display: flex; gap: 3px; margin-bottom: 0.7rem; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.08); }
  .dot.done { background: #2A3F6A; border: 1px solid #8BA4D4; }
  .dot.final { background: #6B3A8A; border: 1px solid #A070D0; }

  /* 액션 버튼 행 */
  .team-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .hint-btn { background: rgba(60,30,80,0.4); border: 1px solid rgba(140,80,180,0.4); color: #C0A0E8; font-family: var(--font-d); font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 3px; padding: 0.35rem 0.7rem; cursor: pointer; transition: background 0.2s; }
  .hint-btn:hover { background: rgba(60,30,80,0.7); }
  .finish-btn { background: rgba(20,40,80,0.5); border: 1px solid rgba(80,120,200,0.4); color: #8BA4D4; font-family: var(--font-d); font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 3px; padding: 0.35rem 0.7rem; cursor: pointer; transition: background 0.2s; }
  .finish-btn:hover { background: rgba(20,40,80,0.8); }
  .finish-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .finished-tag { font-family: var(--font-d); font-size: 0.58rem; color: #5cb85c; letter-spacing: 0.08em; padding: 0.35rem 0.5rem; }

  .finish-time-display { font-size: 0.8rem; color: #5cb85c; font-style: italic; margin-top: 0.4rem; }
  .hint-count { font-size: 0.75rem; color: #C0A0E8; opacity: 0.7; margin-top: 0.2rem; }

  /* ── 로그 ── */
  .log-area { background: #080C18; border: 1px solid rgba(140,164,212,0.1); border-radius: 4px; padding: 0.8rem; font-size: 0.78rem; font-family: monospace; max-height: 180px; overflow-y: auto; }
  .log-line { opacity: 0.6; margin-bottom: 0.25rem; }
  .log-line.success { color: #5cb85c; opacity: 0.85; }
  .log-line.warn { color: var(--gold); opacity: 0.85; }
  .log-line.hint { color: #C0A0E8; opacity: 0.85; }

  .divider { height: 1px; background: linear-gradient(90deg,transparent,rgba(140,164,212,0.15),transparent); margin: 1.5rem 0; }
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="login-box">
    <h2>⚙️ 관리자 접속</h2>
    <input type="password" id="pwInput" placeholder="비밀번호" autocomplete="off">
    <button class="btn btn-gold btn-block" onclick="adminLogin()">접속</button>
    <p id="loginErr"></p>
  </div>
</div>

<header>
  <div>
    <h1>⚙️ 호그와트 챌린지 2026 — 어드민</h1>
  </div>
  <div style="display:flex;align-items:center;gap:1.2rem">
    <span id="adminTimer">대기 중</span>
    <a href="scoreboard.html" class="btn btn-ghost btn-sm">점수판 →</a>
  </div>
</header>

<div class="page">

  <!-- 게임 컨트롤 -->
  <p class="section-label" style="margin-top:0">게임 컨트롤</p>
  <div class="ctrl-row">
    <div class="ctrl-card">
      <h3>게임 상태</h3>
      <div class="big" id="gameStateDisplay">대기</div>
      <button class="btn btn-gold btn-block" id="startBtn" onclick="startGame()">⚡ 게임 시작</button>
    </div>
    <div class="ctrl-card">
      <h3>완료 팀</h3>
      <div class="big" id="finishedCount">0</div>
      <p style="font-size:0.78rem;opacity:0.5">팀 완료 리포트</p>
    </div>
    <div class="ctrl-card">
      <h3>경과 시간</h3>
      <div class="big" id="elapsedDisplay">0분</div>
      <p style="font-size:0.78rem;opacity:0.5">게임 시작 기준</p>
    </div>
    <div class="ctrl-card">
      <h3>리셋</h3>
      <p style="font-size:0.78rem;opacity:0.5;margin-bottom:0.6rem">모든 데이터 초기화</p>
      <button class="btn btn-danger btn-block" onclick="resetGame()">전체 리셋</button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- 팀 현황 -->
  <p class="section-label">팀 현황 — 힌트 지급 / 완료 처리</p>
  <div class="team-grid" id="teamGrid"></div>

  <!-- 로그 -->
  <p class="section-label">활동 로그</p>
  <div class="log-area" id="logArea"><div class="log-line">대기 중...</div></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
// ── 로그인 ──────────────────────────────────────────────────
function adminLogin() {
  const pw = document.getElementById('pwInput').value;
  if (pw === GAME_CONFIG.adminPassword) {
    document.getElementById('loginOverlay').style.display = 'none';
    init();
  } else {
    document.getElementById('loginErr').textContent = '비밀번호가 틀렸습니다.';
  }
}
document.getElementById('pwInput').addEventListener('keydown', e => { if(e.key==='Enter') adminLogin(); });

// ── 초기화 ──────────────────────────────────────────────────
function init() {
  // 타이머
  let timerInterval;
  Store.onGameStarted(started => {
    if (started) {
      document.getElementById('gameStateDisplay').textContent = '진행 중';
      document.getElementById('startBtn').textContent = '진행 중';
      document.getElementById('startBtn').disabled = true;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        Store.getRemainingSeconds(rem => {
          const elapsed = GAME_CONFIG.totalMinutes * 60 - rem;
          const m = Math.floor(elapsed / 60);
          const s = Math.floor(elapsed % 60);
          document.getElementById('adminTimer').textContent =
            `${String(Math.floor(GAME_CONFIG.totalMinutes*60 - elapsed)).padStart(0,'0')}`;
          // show remaining
          const remM = Math.floor(rem/60), remS = Math.floor(rem%60);
          document.getElementById('adminTimer').textContent =
            `${String(remM).padStart(2,'0')}:${String(remS).padStart(2,'0')}`;
          document.getElementById('adminTimer').classList.toggle('urgent', rem < 300);
          document.getElementById('elapsedDisplay').textContent = `${m}분 ${s}초`;
        });
      }, 1000);
    }
  });

  // 팀 현황 실시간
  Store.onLeaderboard(({ teams }) => {
    renderTeamGrid(teams);
    const finished = teams.filter(t => t.finishTime).length;
    document.getElementById('finishedCount').textContent = finished;
  });
}

// ── 팀 그리드 렌더 ──────────────────────────────────────────
function renderTeamGrid(teams) {
  document.getElementById('teamGrid').innerHTML = teams.map(t => {
    const house = GAME_CONFIG.houses.find(h => h.id === t.house);
    const isFinished = !!t.finishTime;
    const hintCount = t.hintCount || 0;

    // 스테이션 도트
    const dots = GAME_CONFIG.stations.map(st => {
      const done = t.stations?.[st.id]?.completed;
      const isFinal = st.id === 7;
      return `<div class="dot ${done ? (isFinal ? 'final' : 'done') : ''}"></div>`;
    }).join('');

    // finish time 표시
    let finishDisplay = '';
    if (isFinished && t.finishTime) {
      const mins = Math.floor(t.finishTime / 60);
      const secs = Math.floor(t.finishTime % 60);
      const timePenalty = Math.floor(t.finishTime / 60) * 10;
      finishDisplay = `<div class="finish-time-display">✓ ${mins}분 ${secs}초 완료 (시간 감점: -${timePenalty}점)</div>`;
    }

    const hintDisplay = hintCount > 0
      ? `<div class="hint-count">힌트 ${hintCount}회 사용 (-${hintCount * 100}점)</div>`
      : '';

    return `<div class="team-card ${isFinished ? 'finished' : ''}">
      <div class="team-card-header">
        <div>
          <div class="team-card-name">${t.displayName}</div>
          <div class="team-card-house">${house?.emoji} ${house?.name}</div>
        </div>
        <div class="team-card-score">${t.total}점</div>
      </div>
      <div class="station-dots">${dots}</div>
      ${finishDisplay}
      ${hintDisplay}
      <div class="team-actions">
        <button class="hint-btn" onclick="giveHint('${t.code}')">💡 힌트 지급 (-100점)</button>
        ${isFinished
          ? `<span class="finished-tag">✓ 완료 처리됨</span>`
          : `<button class="finish-btn" onclick="markFinish('${t.code}')">🏁 완료 처리</button>`
        }
      </div>
    </div>`;
  }).join('');
}

// ── 게임 시작 ──────────────────────────────────────────────
function startGame() {
  if (confirm('게임을 시작할까요? 모든 팀의 타이머가 동시에 시작됩니다.')) {
    Store.startGame();
    addLog('⚡ 게임 시작!', 'success');
  }
}

// ── 힌트 지급 ──────────────────────────────────────────────
function giveHint(teamCode) {
  const teamName = GAME_CONFIG.teams[teamCode]?.displayName;
  if (!confirm(`${teamName}에게 힌트를 지급할까요? (-100점)`)) return;
  Store.giveHint(teamCode, () => {
    addLog(`💡 힌트 지급 → ${teamName} (-100점)`, 'hint');
  });
}

// ── 완료 처리 ──────────────────────────────────────────────
function markFinish(teamCode) {
  const teamName = GAME_CONFIG.teams[teamCode]?.displayName;
  if (!confirm(`${teamName} 완료 처리할까요? 현재 경과 시간이 기록됩니다.`)) return;
  Store.markFinish(teamCode, (elapsedSeconds) => {
    const m = Math.floor(elapsedSeconds / 60);
    const s = Math.floor(elapsedSeconds % 60);
    addLog(`🏁 완료 → ${teamName} (${m}분 ${s}초, 시간 감점 -${m*10}점)`, 'success');
  });
}

// ── 리셋 ───────────────────────────────────────────────────
function resetGame() {
  if (confirm('정말 모든 데이터를 초기화할까요? 되돌릴 수 없습니다.')) {
    Store.reset(() => {
      addLog('⚠️ 전체 리셋 완료', 'warn');
      document.getElementById('startBtn').disabled = false;
      document.getElementById('startBtn').textContent = '⚡ 게임 시작';
      document.getElementById('gameStateDisplay').textContent = '대기';
      document.getElementById('adminTimer').textContent = '대기 중';
    });
  }
}

// ── 로그 ───────────────────────────────────────────────────
function addLog(msg, type='') {
  const logArea = document.getElementById('logArea');
  const time = new Date().toLocaleTimeString('ko-KR');
  const div = document.createElement('div');
  div.className = `log-line ${type}`;
  div.textContent = `[${time}] ${msg}`;
  logArea.insertBefore(div, logArea.firstChild);
}
</script>
</body>
</html>
