<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타이머 — 해리포터와 새누리의 비밀</title>
<link rel="icon" href="images/harry.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Pirata+One&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #8BA4D4; --gold-lt: #C0D4F0; --parchment: #D8E4F5;
    --deep: #050308;
    --font-d: 'Cinzel', serif; --font-b: 'Crimson Text', Georgia, serif;
  }
  html, body {
    height: 100%; background: var(--deep); color: var(--parchment);
    font-family: var(--font-b); overflow: hidden;
  }

  #bg-canvas { position: fixed; inset: 0; z-index: 0; }

  .page {
    position: relative; z-index: 2;
    height: 100vh; width: 100vw;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2vh;
  }

  .title-img {
    width: min(38vw, 420px);
    filter: invert(1) sepia(0.3) saturate(1.5) hue-rotate(180deg) brightness(0.85);
    mix-blend-mode: screen;
    opacity: 0.92;
    transition: opacity 1s;
  }

  .event-tag {
    font-family: var(--font-d);
    font-size: clamp(0.8rem, 1.4vw, 1.1rem);
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0.6;
  }

  #timerDisplay {
    font-family: 'Pirata One', cursive;
    font-size: min(22vw, 20rem);
    line-height: 1;
    color: var(--gold-lt);
    text-shadow: 0 0 60px rgba(140,164,212,0.5), 0 0 120px rgba(140,164,212,0.25);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    transition: color 0.6s, text-shadow 0.6s;
  }
  #timerDisplay.urgent {
    color: #ff8080;
    text-shadow: 0 0 60px rgba(255,100,100,0.6), 0 0 140px rgba(255,60,60,0.35);
    animation: pulse-urgent 1s ease-in-out infinite;
  }
  @keyframes pulse-urgent {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }

  #gameStatus {
    font-family: var(--font-d);
    font-size: clamp(1rem, 1.8vw, 1.4rem);
    letter-spacing: 0.25em;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0.75;
  }

  /* 마법 지팡이 스파크 */
  .spark {
    position: fixed; border-radius: 50%;
    pointer-events: none; z-index: 1;
    animation: spark-fly linear forwards;
  }
  @keyframes spark-fly {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0.2); }
  }

  /* 파티클 (별가루) */
  @keyframes float-up {
    0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(-100vh) translateX(var(--dx)) scale(0.3); opacity: 0; }
  }
  .particle {
    position: fixed; bottom: -10px; width: 3px; height: 3px; border-radius: 50%;
    background: var(--gold); pointer-events: none; z-index: 1;
    animation: float-up var(--dur) ease-in infinite; animation-delay: var(--delay);
    opacity: 0; --dx: 0px;
  }

  /* 최종 완료 오버레이 */
  #doneOverlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(5,3,8,0.92);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 1.5rem;
    text-align: center;
  }
  #doneOverlay.show { display: flex; }
  #doneOverlay .big-icon { font-size: min(15vw, 8rem); }
  #doneOverlay h1 {
    font-family: var(--font-d); font-size: clamp(2rem, 5vw, 4rem);
    color: var(--gold-lt); letter-spacing: 0.1em;
    text-shadow: 0 0 40px rgba(140,164,212,0.5);
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="page">
  <img src="title.png" alt="Harry Potter and the Secret of Saenuri" class="title-img">
  <p class="event-tag">2026 · Saenuri Unplugged Conference</p>
  <div id="timerDisplay">—:--</div>
  <p id="gameStatus">The Game Awaits</p>
</div>

<div id="doneOverlay">
  <div class="big-icon">⏰</div>
  <h1>시간 종료</h1>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="config.js?v=20"></script>
<script src="store.js?v=20"></script>
<script>
// ── 배경 별 ────────────────────────────────────────────────
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [], t = 0;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({length: 220}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.6 + 0.2,
      speed: Math.random() * 0.006 + 0.001,
      phase: Math.random() * Math.PI * 2,
      color: Math.random() > 0.8 ? [180,200,255] : [240,220,160],
    }));
  }

  function draw(ts) {
    t = ts * 0.001;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const grad = ctx.createRadialGradient(
      canvas.width*0.5, canvas.height*0.35, 0,
      canvas.width*0.5, canvas.height*0.5, canvas.width*0.85
    );
    grad.addColorStop(0, 'rgba(15,10,30,1)');
    grad.addColorStop(0.5, 'rgba(5,3,12,1)');
    grad.addColorStop(1, 'rgba(2,1,5,1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      const alpha = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * s.speed * 60 + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${s.color[0]},${s.color[1]},${s.color[2]},${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();

// ── 별가루 파티클 ─────────────────────────────────────────
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.cssText = `
    left: ${Math.random()*100}%;
    --dur: ${5 + Math.random()*7}s;
    --delay: ${Math.random()*10}s;
    --dx: ${(Math.random()-0.5)*100}px;
    width: ${1+Math.random()*2.5}px;
    height: ${1+Math.random()*2.5}px;
    background: ${Math.random() > 0.5 ? '#8BA4D4' : '#C0D4F0'};
    opacity: ${0.3+Math.random()*0.4};
  `;
  document.body.appendChild(p);
}

// ── 마법 지팡이 스파크 (주기적으로 랜덤 위치에서 튐) ─────────
function spawnSparks() {
  const count = 8;
  const cx = Math.random() * window.innerWidth;
  const cy = Math.random() * window.innerHeight * 0.4 + window.innerHeight * 0.3;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const dist = 40 + Math.random() * 60;
    s.className = 'spark';
    s.style.cssText = `
      left: ${cx}px; top: ${cy}px;
      width: ${2+Math.random()*3}px; height: ${2+Math.random()*3}px;
      background: ${Math.random() > 0.5 ? '#C0D4F0' : '#8BA4D4'};
      box-shadow: 0 0 8px currentColor;
      --sx: ${Math.cos(angle)*dist}px; --sy: ${Math.sin(angle)*dist}px;
      animation-duration: ${0.8+Math.random()*0.6}s;
    `;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1500);
  }
}
setInterval(spawnSparks, 4000);

// ── 타이머 ──────────────────────────────────────────────────
let timerInterval;
let hasShownDone = false;

Store.onGameStarted(started => {
  const statusEl = document.getElementById('gameStatus');
  const timerEl = document.getElementById('timerDisplay');
  const doneOverlay = document.getElementById('doneOverlay');

  if (!started) {
    statusEl.textContent = 'The Game Awaits';
    timerEl.textContent = `${String(GAME_CONFIG.totalMinutes).padStart(2,'0')}:00`;
    return;
  }

  statusEl.textContent = '⚡ 게임 진행 중';
  clearInterval(timerInterval);

  firebase.database().ref('game/startTime').once('value', snap => {
    const startTime = snap.val();
    if (!startTime) return;
    timerInterval = setInterval(() => {
      const elapsed = (Date.now() - startTime) / 1000;
      const rem = Math.max(0, GAME_CONFIG.totalMinutes * 60 - elapsed);
      const m = Math.floor(rem/60), s = Math.floor(rem%60);
      timerEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      timerEl.classList.toggle('urgent', rem < 300 && rem > 0);

      if (rem <= 0) {
        statusEl.textContent = '🏁 게임 종료';
        clearInterval(timerInterval);
        if (!hasShownDone) {
          hasShownDone = true;
          setTimeout(() => { doneOverlay.classList.add('show'); }, 1000);
        }
      }
    }, 1000);
  });
});
</script>
</body>
</html>
