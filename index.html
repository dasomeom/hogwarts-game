<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해리포터와 새누리의 비밀</title>
<link rel="icon" href="images/harry.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Pirata+One&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold:    #8BA4D4;
    --gold-lt: #C0D4F0;
    --gold-dim:#4A6494;
    --parchment: #D8E4F5;
    --ink:     #0A0F1A;
    --deep:    #050308;
    --navy:    #0A0C1A;
    --stone:   #0E1220;
    --scarlet: #1A2A5A;
    --font-d: 'Cinzel', serif;
    --font-b: 'Crimson Text', Georgia, serif;
  }

  html, body {
    height: 100%;
    background: var(--deep);
    color: var(--parchment);
    font-family: var(--font-b);
    overflow-x: hidden;
  }

  /* ── 배경 레이어 ── */
  #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  /* 안개 레이어 */
  .mist {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 40% at 50% 100%, rgba(30,20,60,0.7) 0%, transparent 70%),
      radial-gradient(ellipse 60% 30% at 20% 80%, rgba(10,10,40,0.5) 0%, transparent 60%),
      radial-gradient(ellipse 60% 30% at 80% 80%, rgba(10,10,40,0.5) 0%, transparent 60%);
  }

  /* 번개 흉터 장식 */
  .lightning-deco {
    position: fixed; top: 0; right: 0; width: 200px; height: 200px;
    z-index: 1; pointer-events: none; opacity: 0.04;
  }

  /* ── 페이지 레이아웃 ── */
  .page {
    position: relative; z-index: 2;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 1.5rem 5rem;
  }

  /* ── 타이틀 이미지 ── */
  .title-area {
    margin-top: 3.5rem;
    text-align: center;
    width: 100%;
    max-width: 520px;
  }
  .title-img {
    width: 100%;
    filter: invert(1) sepia(0.3) saturate(1.5) hue-rotate(180deg) brightness(0.85);
    /* 흰 배경 제거 효과 */
    mix-blend-mode: screen;
    opacity: 0.92;
  }
  /* 이미지 뒤 글로우 */
  .title-glow {
    position: relative;
  }
  .title-glow::after {
    content: '';
    position: absolute;
    inset: -20px;
    background: radial-gradient(ellipse, rgba(80,120,220,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: -1;
  }

  /* ── 날짜 태그 ── */
  .event-tag {
    font-family: var(--font-d);
    font-size: 0.65rem;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0.65;
    margin-top: 1rem;
  }

  .divider {
    width: 200px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(140,170,220,0.4), transparent);
    margin: 1.8rem auto;
  }

  .event-tag {
    font-family: var(--font-d);
    font-size: 0.65rem;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    opacity: 0.65;
    margin-top: 1rem;
  }

  /* ── 팀 코드 카드 ── */
  .login-card {
    width: 100%; max-width: 380px;
    background: linear-gradient(160deg, rgba(10,15,30,0.97) 0%, rgba(5,8,18,0.99) 100%);
    border: 1px solid rgba(140,170,220,0.2);
    border-radius: 2px;
    padding: 2rem 1.8rem;
    box-shadow:
      0 0 0 1px rgba(140,170,220,0.05),
      0 20px 60px rgba(0,0,0,0.8),
      inset 0 1px 0 rgba(140,170,220,0.08);
    margin: 0 auto;
    position: relative;
    overflow: hidden;
  }
  /* 카드 코너 장식 */
  .login-card::before, .login-card::after {
    content: '✦';
    position: absolute;
    font-size: 0.6rem;
    color: var(--gold);
    opacity: 0.3;
  }
  .login-card::before { top: 0.6rem; left: 0.8rem; }
  .login-card::after  { bottom: 0.6rem; right: 0.8rem; }

  .login-card h2 {
    font-family: var(--font-d);
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.3em;
    color: #8BA4D4;
    text-align: center;
    margin-bottom: 1.5rem;
    text-transform: uppercase;
    opacity: 0.8;
  }

  .input-wrap input {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(140,170,220,0.2);
    border-bottom-color: rgba(140,170,220,0.5);
    border-radius: 0;
    padding: 0.85rem 1rem;
    color: var(--gold-lt);
    font-family: var(--font-d);
    font-size: 1.1rem;
    letter-spacing: 0.15em;
    text-align: center;
    text-transform: uppercase;
    outline: none;
    transition: all 0.2s;
    margin-bottom: 1rem;
  }
  .input-wrap input::placeholder { color: rgba(140,170,220,0.2); }
  .input-wrap input:focus {
    border-color: rgba(140,170,220,0.6);
    background: rgba(140,170,220,0.03);
    box-shadow: 0 4px 20px rgba(100,140,220,0.08);
  }

  .btn-enter {
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(180deg, #2A3F6A 0%, #1A2D52 50%, #2A3F6A 100%);
    border: 1px solid rgba(140,170,220,0.4);
    border-radius: 1px;
    color: #C0D4F0;
    font-family: var(--font-d);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    cursor: pointer;
    transition: filter 0.2s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }
  .btn-enter::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 50%);
  }
  .btn-enter:hover { filter: brightness(1.2); }
  .btn-enter:active { transform: translateY(1px); }

  .error-msg {
    color: #e05050;
    font-size: 0.82rem;
    text-align: center;
    margin-top: 0.7rem;
    min-height: 1.2em;
    font-style: italic;
  }

  /* ── 기숙사 배지 ── */
  .houses {
    display: flex; gap: 0.6rem; justify-content: center;
    margin-top: 2.5rem; flex-wrap: nowrap;
    max-width: 480px; margin-left: auto; margin-right: auto;
  }
  .house-badge {
    display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
    padding: 0.7rem 0.5rem;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 3px;
    background: rgba(255,255,255,0.02);
    font-family: var(--font-d);
    font-size: 0.5rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--parchment);
    opacity: 0.65;
    transition: opacity 0.3s, border-color 0.3s, transform 0.3s;
    flex: 1 1 0; min-width: 0; text-align: center;
    cursor: default;
  }
  .house-badge:hover { opacity: 1; transform: translateY(-3px); }
  .house-badge.gryffindor:hover { border-color: #740001; }
  .house-badge.slytherin:hover  { border-color: #1A472A; }
  .house-badge.ravenclaw:hover  { border-color: #0E1A40; }
  .house-badge.hufflepuff:hover { border-color: #ECB939; }
  .house-img { width: 48px; height: 48px; object-fit: contain; }
  @media (min-width: 500px) {
    .houses { gap: 1rem; }
    .house-badge { padding: 1rem; font-size: 0.6rem; letter-spacing: 0.12em; }
    .house-img { width: 64px; height: 64px; }
  }

  /* ── 하단 링크 ── */
  .nav-links {
    display: flex; gap: 2.5rem; justify-content: center;
    margin-top: 2.5rem; flex-wrap: wrap;
  }
  .nav-links a {
    font-family: var(--font-d);
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    color: #8BA4D4;
    opacity: 0.4;
    text-decoration: none;
    text-transform: uppercase;
    transition: opacity 0.2s;
  }
  .nav-links a:hover { opacity: 0.9; }

  /* ── 파티클 ── */
  @keyframes float-up {
    0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(-100vh) translateX(var(--dx)) scale(0.3); opacity: 0; }
  }
  .particle {
    position: fixed;
    bottom: -10px;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--gold);
    pointer-events: none;
    z-index: 1;
    animation: float-up var(--dur) ease-in infinite;
    animation-delay: var(--delay);
    opacity: 0;
    --dx: 0px;
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="mist"></div>

<!-- 파티클 -->
<script>
for (let i = 0; i < 25; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.cssText = `
    left: ${Math.random()*100}%;
    --dur: ${4 + Math.random()*6}s;
    --delay: ${Math.random()*8}s;
    --dx: ${(Math.random()-0.5)*80}px;
    width: ${1+Math.random()*2}px;
    height: ${1+Math.random()*2}px;
    background: ${Math.random() > 0.5 ? '#8BA4D4' : '#C0D4F0'};
    opacity: ${0.3+Math.random()*0.4};
  `;
  document.body.appendChild(p);
}
</script>

<div class="page">

  <!-- 타이틀 이미지 -->
  <div class="title-area title-glow">
    <img src="title.png" alt="Harry Potter and the Secret of Saenuri" class="title-img">
    <p class="event-tag">2026 · Saenuri Unplugged Conference</p>
  </div>

  <div id="indexTimer" style="font-family:'Pirata One',cursive;font-size:2.4rem;color:var(--gold);text-shadow:0 0 12px rgba(140,164,212,0.3);margin-top:1.8rem;padding:0.3rem 1.5rem;border:1px solid rgba(140,164,212,0.15);border-radius:3px;letter-spacing:0.05em;min-width:9rem;text-align:center;font-variant-numeric:tabular-nums">—:--</div>

  <div class="divider"></div>

  <!-- 팀 코드 입력 -->
  <div class="login-card">
    <h2>Enter Team Code</h2>
    <div class="input-wrap">
      <input
        type="text"
        id="teamCode"
        placeholder="GRIFFIN-1"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        maxlength="10"
      >
    </div>
    <button class="btn-enter" onclick="enterTeam()">Enter the Chamber</button>
    <p class="error-msg" id="errMsg"></p>
  </div>

  <!-- 기숙사 -->
  <div class="houses">
    <div class="house-badge gryffindor"><img src="images/gryffindor.png" alt="Gryffindor" class="house-img">Gryffindor</div>
    <div class="house-badge slytherin"><img src="images/slytherin.png" alt="Slytherin" class="house-img">Slytherin</div>
    <div class="house-badge ravenclaw"><img src="images/ravenclaw.png" alt="Ravenclaw" class="house-img">Ravenclaw</div>
    <div class="house-badge hufflepuff"><img src="images/hufflepuff.png" alt="Hufflepuff" class="house-img">Hufflepuff</div>
  </div>

  <nav class="nav-links">
    <a href="scoreboard.html">📊 Scoreboard</a>
    <a href="timer.html">⏱️ Timer</a>
    <a href="admin.html">⚙️ Admin</a>
  </nav>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="config.js?v=19"></script>
<script src="store.js?v=19"></script>
<script>
// ── 배경 — 별 + 안개 흐름 ──────────────────────────────────
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [], t = 0;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({length: 220}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.4 + 0.1,
      speed: Math.random() * 0.006 + 0.001,
      phase: Math.random() * Math.PI * 2,
      color: Math.random() > 0.8 ? [180,200,255] : [240,220,160],
    }));
  }

  function draw(ts) {
    t = ts * 0.001;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 배경 그라디언트
    const grad = ctx.createRadialGradient(
      canvas.width*0.5, canvas.height*0.3, 0,
      canvas.width*0.5, canvas.height*0.5, canvas.width*0.8
    );
    grad.addColorStop(0, 'rgba(15,10,30,1)');
    grad.addColorStop(0.5, 'rgba(5,3,12,1)');
    grad.addColorStop(1, 'rgba(2,1,5,1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 별
    stars.forEach(s => {
      const alpha = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * s.speed * 60 + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${s.color[0]},${s.color[1]},${s.color[2]},${alpha})`;
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();

// ── 팀 입장 ──────────────────────────────────────────────────
function enterTeam() {
  const raw = document.getElementById('teamCode').value.trim().toUpperCase();
  const err = document.getElementById('errMsg');
  if (!raw) { err.textContent = '팀 코드를 입력해 주세요.'; return; }
  if (!GAME_CONFIG.teams[raw]) {
    err.textContent = '유효하지 않은 팀 코드입니다.';
    return;
  }
  sessionStorage.setItem('hg_team', raw);
  window.location.href = 'team.html';
}

document.getElementById('teamCode').addEventListener('keydown', e => {
  if (e.key === 'Enter') enterTeam();
});

// ── 타이머 ──────────────────────────────────────────────────
function updateIndexTimer() {
  const el = document.getElementById('indexTimer');
  Store.isGameStarted(started => {
    if (!started) {
      el.textContent = '게임 대기 중';
      return;
    }
    Store.getRemainingSeconds(rem => {
      const m = Math.floor(rem/60), s = Math.floor(rem%60);
      el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      el.style.color = rem < 300 ? '#ff6b6b' : '';
    });
  });
}
updateIndexTimer();
setInterval(updateIndexTimer, 1000);
</script>
</body>
</html>
