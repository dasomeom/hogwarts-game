<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해리포터와 새누리의 비밀</title>
<link rel="icon" href="images/harry.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #8BA4D4; --gold-lt: #C0D4F0; --parchment: #D8E4F5;
    --ink: #0A0F1A; --deep: #050308;
    --font-d: 'Cinzel', serif; --font-b: 'Crimson Text', Georgia, serif;
    --font-a: 'Amatic SC', cursive;
  }
  body { background: var(--deep); color: var(--parchment); font-family: var(--font-b); min-height: 100vh; }

  header {
    background: linear-gradient(180deg, #080C18, #050308);
    border-bottom: 1px solid rgba(140,164,212,0.2);
    padding: 1rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap;
  }
  .team-id { font-family: var(--font-d); font-size: 0.65rem; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; }
  .team-name { font-family: var(--font-d); font-size: 1rem; font-weight: 700; color: var(--gold-lt); }
  .house-tag { font-family: var(--font-d); font-size: 0.6rem; letter-spacing: 0.15em; opacity: 0.6; }

  .timer-bar {
    background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(140,164,212,0.1);
    padding: 0.6rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
  }
  #gameStatus { font-family: var(--font-d); font-size: 0.65rem; letter-spacing: 0.1em; color: var(--gold); opacity: 0.7; text-transform: uppercase; }
  #timerDisplay { font-family: var(--font-d); font-size: 1.8rem; font-weight: 700; color: var(--gold-lt); text-shadow: 0 0 20px rgba(140,164,212,0.4); }
  #timerDisplay.urgent { color: #ff6b6b; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  .progress-track { padding: 1rem 1.5rem 0.3rem; display: flex; gap: 0.4rem; align-items: center; }
  .progress-pip {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid rgba(140,164,212,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; font-family: var(--font-d); color: rgba(140,164,212,0.3);
    transition: all 0.4s; flex-shrink: 0;
  }
  .progress-pip.done { background: #2A3F6A; border-color: #8BA4D4; color: #C0D4F0; }
  .progress-line { flex: 1; height: 1px; background: rgba(140,164,212,0.15); }

  main { padding: 1rem 1.5rem 5rem; max-width: 600px; margin: 0 auto; }

  /* ── 호크룩스 카드 ── */
  .horcrux-card {
    background: linear-gradient(160deg, #0C1020, #080C18);
    border: 1px solid rgba(140,164,212,0.15);
    border-radius: 4px; margin-bottom: 1rem; overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .horcrux-card.active { border-color: rgba(140,164,212,0.45); box-shadow: 0 0 24px rgba(100,140,220,0.08); }
  .horcrux-card.done { border-color: rgba(100,200,100,0.25); }

  .card-header { padding: 1rem 1.2rem; display: flex; align-items: center; gap: 0.9rem; }
  .horcrux-emoji { font-size: 2rem; flex-shrink: 0; width: 44px; text-align: center; }
  .horcrux-img-wrap {
    width: 44px; height: 44px; flex-shrink: 0;
    background: transparent; display: flex; align-items: center; justify-content: center;
  }
  .horcrux-img-wrap img { width: 44px; height: 44px; object-fit: contain; display: none; filter: invert(1) opacity(0.9); }
  .horcrux-img-wrap img.loaded { display: block; }
  .card-meta { flex: 1; min-width: 0; }
  .card-riddle-num { font-family: var(--font-b); font-size: 0.65rem; letter-spacing: 0.1em; color: var(--gold); opacity: 0.6; font-style: italic; }
  .card-title { font-family: var(--font-a); font-size: 1.4rem; font-weight: 700; color: var(--gold-lt); line-height: 1.2; }
  .status-badge { font-family: var(--font-d); font-size: 0.55rem; letter-spacing: 0.1em; padding: 0.22rem 0.55rem; border-radius: 2px; border: 1px solid; text-transform: uppercase; white-space: nowrap; flex-shrink: 0; }
  .badge-done { color: #5cb85c; border-color: #5cb85c; background: rgba(80,180,80,0.08); }
  .badge-active { color: var(--gold); border-color: var(--gold); background: rgba(140,164,212,0.08); }

  /* 완료 → 힌트 단어 표시 */
  .card-hint-reveal {
    padding: 0.7rem 1.2rem 0.9rem;
    border-top: 1px solid rgba(140,164,212,0.1);
    background: rgba(80,180,80,0.04);
  }
  .hint-reveal-word {
    font-family: var(--font-b); font-size: 1.4rem; letter-spacing: 0.05em;
    background: linear-gradient(90deg, #7ed87e, #a0f0a0);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  /* 활성 카드 미션 */
  .card-body { padding: 0 1.2rem 1.2rem; border-top: 1px solid rgba(140,164,212,0.1); }
  .mission-label { font-family: var(--font-d); font-size: 0.55rem; letter-spacing: 0.18em; color: var(--gold); opacity: 0.65; text-transform: uppercase; margin: 0.9rem 0 0.4rem; }
  .mission-q { font-size: 0.92rem; font-style: italic; line-height: 1.6; margin-bottom: 0.9rem; opacity: 0.85; }

  input[type="text"] {
    width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(140,164,212,0.25);
    border-radius: 3px; padding: 0.75rem 1rem; color: var(--parchment);
    font-family: var(--font-b); font-size: 1rem; outline: none; transition: border-color 0.2s; margin-bottom: 0.7rem;
  }
  input[type="text"]:focus { border-color: rgba(140,164,212,0.6); }
  .btn { font-family: var(--font-d); font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; border: none; border-radius: 3px; padding: 0.75rem 1.4rem; cursor: pointer; transition: filter 0.2s; width: 100%; text-align: center; }
  .btn:hover { filter: brightness(1.15); }
  .btn-gold { background: linear-gradient(135deg, #1A2D52, #2A3F6A, #1A2D52); color: #C0D4F0; font-weight: 700; border: 1px solid rgba(140,164,212,0.3); }
  .error-msg { color: #ff6b6b; font-style: italic; font-size: 0.8rem; min-height: 1.1em; margin-top: 0.4rem; }
  .hint-toggle { font-family: var(--font-d); font-size: 0.58rem; letter-spacing: 0.1em; color: var(--gold); opacity: 0.45; cursor: pointer; text-transform: uppercase; background: none; border: none; padding: 0; margin-bottom: 0.4rem; display: block; transition: opacity 0.2s; }
  .hint-toggle:hover { opacity: 0.8; }
  .hint-text { font-style: italic; font-size: 0.8rem; opacity: 0.5; margin-bottom: 0.7rem; display: none; }
  .hint-text.visible { display: block; }

  /* ── 7번 최종 섹션 ── */
  .final-section {
    border: 1px solid rgba(140,164,212,0.35);
    border-radius: 4px; margin-top: 1.5rem; overflow: hidden;
    box-shadow: 0 0 30px rgba(100,140,220,0.07);
  }
  .final-section.locked { opacity: 0.3; pointer-events: none; }
  .final-header {
    background: linear-gradient(160deg, #0E1628, #080C18);
    padding: 1rem 1.2rem; border-bottom: 1px solid rgba(140,164,212,0.2);
  }
  .final-riddle-num { font-family: var(--font-d); font-size: 0.52rem; letter-spacing: 0.2em; color: var(--gold); opacity: 0.6; text-transform: uppercase; }
  .final-title { font-family: var(--font-d); font-size: 1rem; color: var(--gold-lt); margin-top: 0.2rem; }
  .final-body { padding: 1.2rem; background: linear-gradient(160deg, #0C1020, #080C18); }

  .letter-pool-label { font-family: var(--font-d); font-size: 0.52rem; letter-spacing: 0.2em; color: var(--gold); opacity: 0.6; text-transform: uppercase; margin-bottom: 0.6rem; }
  .letter-pool { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.5rem; padding: 0.8rem; background: rgba(140,164,212,0.04); border-radius: 3px; min-height: 52px; }
  .letter-tile {
    width: 30px; height: 34px;
    background: linear-gradient(180deg, #1A2540, #0E1628);
    border: 1px solid rgba(140,164,212,0.3); border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-d); font-size: 0.95rem; font-weight: 700; color: var(--gold-lt);
  }

  .tom-riddle-hint {
    margin: 0.8rem 0 1rem;
    padding: 0.8rem 1rem;
    background: rgba(30,50,100,0.2); border: 1px solid rgba(100,130,200,0.3); border-radius: 3px;
    font-family: var(--font-d); font-size: 0.85rem; letter-spacing: 0.05em;
    color: #aac0e8; text-align: center; line-height: 1.8;
  }

  .locked-msg { font-style: italic; opacity: 0.5; font-size: 0.85rem; padding: 1rem; text-align: center; }

  /* 힌트 단어 순차 페이드인 */
  @keyframes hint-appear {
    0% { opacity: 0; transform: translateY(6px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .hint-word {
    font-family: var(--font-b); font-size: 1.3rem; color: #7ed87e;
    margin-right: 0.8rem; display: inline-block;
    opacity: 0; animation: hint-appear 0.5s ease forwards;
  }

  /* 최종 완료 */
  .final-done-banner {
    text-align: center; padding: 2.5rem 1rem;
    background: rgba(140,164,212,0.05); border: 1px solid rgba(140,164,212,0.25);
    border-radius: 4px; margin-top: 1.5rem;
  }
  .final-done-banner h2 { font-family: var(--font-d); font-size: 1.3rem; color: var(--gold-lt); margin-bottom: 0.5rem; }
</style>
</head>
<body>

<header>
  <div>
    <div class="team-id" id="teamCode">—</div>
    <div class="team-name" id="teamName">팀 이름</div>
    <div class="house-tag" id="houseName">기숙사</div>
  </div>
  <a href="scoreboard.html" style="font-family:var(--font-d);font-size:0.6rem;letter-spacing:0.1em;color:var(--gold);opacity:0.45;text-decoration:none;text-transform:uppercase">점수판 →</a>
</header>

<div class="timer-bar">
  <span id="gameStatus">게임 대기 중</span>
  <span id="timerDisplay">80:00</span>
</div>

<div class="progress-track" id="progressTrack"></div>

<main id="mainContent"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
const TEAM_CODE = sessionStorage.getItem('hg_team');
if (!TEAM_CODE || !GAME_CONFIG.teams[TEAM_CODE]) window.location.href = 'index.html';

const TEAM = GAME_CONFIG.teams[TEAM_CODE];
const HOUSE = GAME_CONFIG.houses.find(h => h.id === TEAM.house);

document.getElementById('teamCode').textContent = TEAM_CODE;
document.getElementById('teamName').textContent = TEAM.displayName;
document.getElementById('houseName').textContent = HOUSE.emoji + ' ' + HOUSE.name;

// ── 타이머 ──────────────────────────────────────────────────
let timerInterval;

Store.onGameStarted(started => {
  const statusEl = document.getElementById('gameStatus');
  const timerEl = document.getElementById('timerDisplay');
  if (!started) {
    statusEl.textContent = '게임 대기 중';
    timerEl.textContent = `${String(GAME_CONFIG.totalMinutes).padStart(2,'0')}:00`;
    return;
  }
  statusEl.textContent = '⚡ 게임 진행 중';
  clearInterval(timerInterval);
  // startTime 한 번 읽고 로컬에서 카운트다운
  firebase.database().ref('game/startTime').once('value', snap => {
    const startTime = snap.val();
    if (!startTime) return;
    timerInterval = setInterval(() => {
      const elapsed = (Date.now() - startTime) / 1000;
      const rem = Math.max(0, GAME_CONFIG.totalMinutes * 60 - elapsed);
      const m = Math.floor(rem/60), s = Math.floor(rem%60);
      timerEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      timerEl.classList.toggle('urgent', rem < 300);
      if (rem <= 0) {
        statusEl.textContent = '🏁 게임 종료';
        clearInterval(timerInterval);
      }
    }, 1000);
  });
});

// ── 1번 자동 완료 ───────────────────────────────────────────
Store.getTeamState(TEAM_CODE, ts => {
  if (!ts?.stations?.[1]?.completed) {
    Store.completeStation(TEAM_CODE, 1, GAME_CONFIG.stations[0].maxScore);
  }
});

// ── 실시간 구독 ─────────────────────────────────────────────
let lastCompletedCount = -1;
let finalSequenceStarted = false;

Store.onTeamState(TEAM_CODE, ts => {
  const stations = ts?.stations || {};
  const completedCount = Object.values(stations).filter(v => v.completed).length;
  const allSixDone = [1,2,3,4,5,6].every(id => stations[id]?.completed);

  renderProgress(ts);

  // 완료 개수가 바뀔 때만 renderMain 호출
  if (completedCount !== lastCompletedCount) {
    lastCompletedCount = completedCount;
    renderMain(ts);
  }

  // 6개 완료됐을 때 딱 한 번만 힌트+미션 시퀀스 시작
  if (allSixDone && !finalSequenceStarted) {
    finalSequenceStarted = true;
    startFinalSequence();
  }
});

// ── 진행 트랙 ───────────────────────────────────────────────
function renderProgress(ts) {
  let html = '';
  GAME_CONFIG.stations.forEach((st, i) => {
    const done = ts?.stations?.[st.id]?.completed;
    if (i > 0) html += `<div class="progress-line"></div>`;
    html += `<div class="progress-pip ${done ? 'done' : ''}">${done ? '✓' : i+1}</div>`;
  });
  document.getElementById('progressTrack').innerHTML = html;
}

// ── 메인 렌더 ───────────────────────────────────────────────
let finalSectionRendered = false;
let finalDoneBannerRendered = false;

function renderMain(ts) {
  const completedIds = new Set(
    Object.entries(ts?.stations || {}).filter(([,v]) => v.completed).map(([k]) => Number(k))
  );
  const allSixDone = [1,2,3,4,5,6].every(id => completedIds.has(id));
  const finalDone = completedIds.has(7);

  // 이미 최종 완료 배너 렌더됐으면 다시 쓰지 않음
  if (finalDoneBannerRendered) return;

  // 이미 7번 섹션 렌더됐으면 mainContent 건드리지 않음
  if (finalSectionRendered && !finalDone) return;

  if (finalDone) {
    finalDoneBannerRendered = true;
    const verse = TEAM.verse || '';
    const message = TEAM.message || '';
    const [text, ref] = verse.includes('—') ? verse.split('—') : [verse, ''];
    document.getElementById('mainContent').innerHTML = `
      <div class="final-done-banner">
        <div style="font-size:3rem;margin-bottom:1.5rem">✝️</div>
        ${message ? `<p id="typeMsg" style="font-family:var(--font-b);font-size:1rem;line-height:1.8;color:var(--parchment);opacity:0.85;margin-bottom:1.5rem"></p>` : ''}
        <div style="height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,0.3),transparent);margin-bottom:1.5rem"></div>
        <p id="typeVerse" style="font-family:var(--font-b);font-size:1.2rem;line-height:1.7;color:var(--parchment);font-style:italic;margin-bottom:0.8rem"></p>
        <p id="typeRef" style="font-family:var(--font-d);font-size:0.65rem;letter-spacing:0.15em;color:var(--gold);opacity:0.8"></p>
      </div>`;
    // 타이핑 순서: 메시지 → 성경구절 → 출처 (최초 1회만)
    if (!typedHints.has('done')) {
      typedHints.add('done');
      if (message) {
        typeWriter(document.getElementById('typeMsg'), message, 50, () => {
          setTimeout(() => {
            typeWriter(document.getElementById('typeVerse'), `"${text.trim()}"`, 60, () => {
              setTimeout(() => {
                typeWriter(document.getElementById('typeRef'), ref.trim(), 70);
              }, 400);
            });
          }, 700);
        });
      } else {
        typeWriter(document.getElementById('typeVerse'), `"${text.trim()}"`, 60, () => {
          setTimeout(() => {
            typeWriter(document.getElementById('typeRef'), ref.trim(), 70);
          }, 400);
        });
      }
    } else {
      if (message) document.getElementById('typeMsg').textContent = message;
      document.getElementById('typeVerse').textContent = `"${text.trim()}"`;
      document.getElementById('typeRef').textContent = ref.trim();
    }
    return;
  }

  let html = '';
  const finalSt = GAME_CONFIG.stations[6];

  if (allSixDone) {
    html += `<div class="final-section">
      <div class="final-header">
        <div class="final-riddle-num">${finalSt.riddleNum}</div>
        <div class="final-title">${finalSt.emoji} ${finalSt.title}</div>
      </div>
      <div class="final-body">
        <div id="hintsDisplay" style="padding:0.8rem;background:rgba(80,180,80,0.05);border-radius:3px;margin-bottom:1.2rem;min-height:2.5rem"></div>
        <div class="tom-riddle-hint" id="missionText" style="min-height:3rem"></div>
        <input type="text" id="finalInput" placeholder="정답 입력 (대소문자 구분)" autocomplete="off" style="display:none">
        <button class="btn btn-gold" id="finalSubmitBtn" onclick="submitFinal()" style="display:none">볼드모트를 무찔러라 ⚡</button>
        <p class="error-msg" id="finalErr"></p>
      </div>
    </div>`;
  } else {
    // 1~6번 카드 표시
    GAME_CONFIG.stations.slice(0, 6).forEach(st => {
      const done = completedIds.has(st.id);
      const imgHtml = st.image
        ? `<div class="horcrux-img-wrap"><img src="${st.image}" onload="this.classList.add('loaded')"></div>`
        : `<div class="horcrux-emoji">${st.emoji}</div>`;

      if (done) {
        const imgHtml = st.image
          ? `<div class="horcrux-img-wrap"><img src="${st.image}" onload="this.classList.add('loaded')"></div>`
          : `<div class="horcrux-emoji">${st.emoji}</div>`;
        html += `<div class="horcrux-card done">
          <div class="card-header">
            ${imgHtml}
            <div class="card-meta">
              <div class="card-riddle-num">(${st.riddleNum})</div>
              <div class="card-title">${st.title}</div>
            </div>
            <span class="status-badge badge-done">✓ 파괴됨</span>
          </div>
          <div class="card-hint-reveal">
            <div class="hint-reveal-word" id="hint-word-${st.id}"></div>
          </div>
        </div>`;
        return;
      }

      const m = st.missions?.[0] || {};
      const imgHtml2 = st.image
        ? `<div class="horcrux-img-wrap"><img src="${st.image}" onload="this.classList.add('loaded')"></div>`
        : `<div class="horcrux-emoji">${st.emoji}</div>`;
      html += `<div class="horcrux-card active">
        <div class="card-header">
          ${imgHtml2}
          <div class="card-meta">
            <div class="card-riddle-num">(${st.riddleNum})</div>
            <div class="card-title">${st.title}</div>
          </div>
          <span class="status-badge badge-active">진행 중</span>
        </div>
        <div class="card-body">
          ${m.question ? `<div class="mission-label">수수께끼</div><p class="mission-q">${m.question}</p>` : ''}
          <input type="text" id="quiz-${st.id}" placeholder="정답 입력" autocomplete="off" inputmode="numeric">
          <button class="btn btn-gold" onclick="submitQuiz(${st.id})">호크룩스 파괴 ⚡</button>
          <p class="error-msg" id="err-${st.id}"></p>
        </div>
      </div>`;
    });

    // 잠긴 7번
    const remaining = [1,2,3,4,5,6].filter(id => !completedIds.has(id)).length;
    html += `<div class="final-section locked">
      <div class="final-header">
        <div class="final-riddle-num">${finalSt.riddleNum}</div>
        <div class="final-title">${finalSt.emoji} ${finalSt.title}</div>
      </div>
      <div class="final-body">
        <p class="locked-msg">🔒 호크룩스 ${remaining}개를 더 파괴해야 잠금이 해제됩니다</p>
      </div>
    </div>`;
  }

  document.getElementById('mainContent').innerHTML = html;

  // 타이핑 효과 — 완료된 힌트 단어들 (새로 완료된 것만)
  if (!allSixDone) {
    GAME_CONFIG.stations.slice(0, 6).forEach(st => {
      if (completedIds.has(st.id)) {
        const el = document.getElementById(`hint-word-${st.id}`);
        if (el && !typedHints.has(st.id)) {
          typedHints.add(st.id);
          typeWriter(el, st.hint, 80);
        } else if (el && typedHints.has(st.id)) {
          el.textContent = st.hint;
        }
      }
    });
  }

}

// ── 최종 시퀀스 (딱 한 번만 실행) ──────────────────────────
function startFinalSequence() {
  setTimeout(() => {
    const hintsEl = document.getElementById('hintsDisplay');
    const missionEl = document.getElementById('missionText');
    const finalInput = document.getElementById('finalInput');
    const finalBtn = document.getElementById('finalSubmitBtn');
    if (!hintsEl || !missionEl) return;

    // 힌트 단어를 JS로 하나씩 추가 (HTML에 미리 없음)
    const hints = GAME_CONFIG.stations.slice(0, 6);
    let idx = 0;
    function addNextHint() {
      if (idx >= hints.length) {
        // 힌트 다 끝나면 0.5초 후 미션 텍스트
        setTimeout(typeMission, 500);
        return;
      }
      const st = hints[idx++];
      const span = document.createElement('span');
      span.style.cssText = 'font-family:var(--font-b);font-size:1.3rem;color:#7ed87e;margin-right:0.8rem;opacity:0;transition:opacity 0.4s';
      span.textContent = st.hint;
      hintsEl.appendChild(span);
      // 살짝 딜레이 후 페이드인
      setTimeout(() => { span.style.opacity = '1'; }, 50);
      setTimeout(addNextHint, 900);
    }
    addNextHint();

    function typeMission() {
      if (!missionEl.dataset.done) {
        missionEl.dataset.done = '1';
        const line1 = '마지막 호크룩스는 해리 포터 자신이다.';
        const line2 = '그를 찾아라. 그리고 그의 눈을 바라보며 외쳐라.';
        const spell = 'AVADA KEDAVRA';
        typeWriter(missionEl, line1, 80, () => {
          missionEl.innerHTML += '<br><br>';
          setTimeout(() => {
            const part2 = document.createElement('span');
            missionEl.appendChild(part2);
            typeWriter(part2, line2, 80, () => {
              missionEl.innerHTML += '<br><br>';
              setTimeout(() => {
                const spellEl = document.createElement('span');
                spellEl.style.cssText = 'font-family:var(--font-d);font-size:1.1rem;letter-spacing:0.1em;color:var(--gold-lt)';
                missionEl.appendChild(spellEl);
                typeWriter(spellEl, spell, 200, () => {
                  if (finalInput) finalInput.style.display = 'block';
                  if (finalBtn) finalBtn.style.display = 'block';
                });
              }, 600);
            });
          }, 500);
        });
      }
    }
  }, 200);
}
function buildLetterPool() {
  const hints = GAME_CONFIG.stations.slice(0, 6).map(s => s.hint).join('');
  let letters = hints.split('');
  // 시드 기반 셔플 (팀마다 다르게)
  const seed = TEAM_CODE.split('').reduce((a,c) => a + c.charCodeAt(0), 42);
  for (let i = letters.length - 1; i > 0; i--) {
    const j = Math.abs((seed * 31 + i * 17) % (i + 1));
    [letters[i], letters[j]] = [letters[j], letters[i]];
  }
  return letters.map(ch =>
    `<div class="letter-tile">${ch}</div>`
  ).join('');
}

// ── 이미 타이핑된 힌트 추적 ────────────────────────────────
const typedHints = new Set();

// ── 타이핑 효과 ─────────────────────────────────────────────
function typeWriter(el, text, speed = 40, callback) {
  el.textContent = '';
  let i = 0;
  function tick() {
    if (i < text.length) {
      el.textContent += text[i++];
      setTimeout(tick, speed);
    } else if (callback) {
      callback();
    }
  }
  tick();
}

function typeWriterHTML(el, segments, speed = 40, callback) {
  // segments: [{text, className, tag}, ...]
  // 한 글자씩 순차적으로 여러 스타일 텍스트 타이핑
  let segIdx = 0;
  function nextSegment() {
    if (segIdx >= segments.length) { if (callback) callback(); return; }
    const seg = segments[segIdx++];
    const span = document.createElement(seg.tag || 'span');
    if (seg.className) span.className = seg.className;
    if (seg.style) span.style.cssText = seg.style;
    el.appendChild(span);
    let i = 0;
    function tick() {
      if (i < seg.text.length) {
        span.textContent += seg.text[i++];
        setTimeout(tick, speed);
      } else {
        nextSegment();
      }
    }
    tick();
  }
  nextSegment();
}
function toggleHint(btn) {
  const hint = btn.nextElementSibling;
  hint.classList.toggle('visible');
  btn.textContent = hint.classList.contains('visible') ? '💡 힌트 숨기기' : '💡 힌트 보기';
}

function submitQuiz(stationId) {
  const val = document.getElementById(`quiz-${stationId}`)?.value.trim();
  const err = document.getElementById(`err-${stationId}`);
  if (!val) { if(err) err.textContent = '정답을 입력해 주세요.'; return; }
  const station = GAME_CONFIG.stations.find(s => s.id === stationId);
  if (val === station.answer) {
    Store.completeStation(TEAM_CODE, stationId, station.maxScore);
  } else {
    if(err) err.textContent = '틀렸습니다. 다시 시도해 보세요.';
  }
}

function submitFinal() {
  const val = document.getElementById('finalInput')?.value.trim();
  const err = document.getElementById('finalErr');
  if (!val) { if(err) err.textContent = '정답을 입력해 주세요.'; return; }
  const finalStation = GAME_CONFIG.stations[6];
  if (val === finalStation.answer) {
    Store.completeStation(TEAM_CODE, 7, finalStation.maxScore);
  } else {
    if(err) err.textContent = '틀렸습니다. 대소문자를 확인하세요.';
  }
}
