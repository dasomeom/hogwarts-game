<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>호크룩스 챌린지</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #D4AF37; --gold-lt: #F0D060; --parchment: #F5E6C8;
    --ink: #1A0A00; --deep: #0D0800;
    --font-d: 'Cinzel', serif; --font-b: 'Crimson Text', Georgia, serif;
  }
  body { background: var(--deep); color: var(--parchment); font-family: var(--font-b); min-height: 100vh; }

  header {
    background: linear-gradient(180deg, #1A0E04, #0D0800);
    border-bottom: 1px solid rgba(212,175,55,0.2);
    padding: 1rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap;
  }
  .team-id { font-family: var(--font-d); font-size: 0.65rem; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; }
  .team-name { font-family: var(--font-d); font-size: 1rem; font-weight: 700; color: var(--gold-lt); }
  .house-tag { font-family: var(--font-d); font-size: 0.6rem; letter-spacing: 0.15em; opacity: 0.6; }

  .timer-bar {
    background: rgba(0,0,0,0.5); border-bottom: 1px solid rgba(212,175,55,0.1);
    padding: 0.6rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
  }
  #gameStatus { font-family: var(--font-d); font-size: 0.65rem; letter-spacing: 0.1em; color: var(--gold); opacity: 0.7; text-transform: uppercase; }
  #timerDisplay { font-family: var(--font-d); font-size: 1.8rem; font-weight: 700; color: var(--gold-lt); text-shadow: 0 0 20px rgba(212,175,55,0.4); }
  #timerDisplay.urgent { color: #ff6b6b; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  .progress-track { padding: 1rem 1.5rem 0.3rem; display: flex; gap: 0.4rem; align-items: center; }
  .progress-pip {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid rgba(212,175,55,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; font-family: var(--font-d); color: rgba(212,175,55,0.3);
    transition: all 0.4s; flex-shrink: 0;
  }
  .progress-pip.done { background: var(--gold); border-color: var(--gold); color: var(--ink); }
  .progress-line { flex: 1; height: 1px; background: rgba(212,175,55,0.15); }

  main { padding: 1rem 1.5rem 5rem; max-width: 600px; margin: 0 auto; }

  /* ── 호크룩스 카드 ── */
  .horcrux-card {
    background: linear-gradient(160deg, #1E1408, #120C04);
    border: 1px solid rgba(212,175,55,0.15);
    border-radius: 4px; margin-bottom: 1rem; overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .horcrux-card.active { border-color: rgba(212,175,55,0.45); box-shadow: 0 0 24px rgba(212,175,55,0.07); }
  .horcrux-card.done { border-color: rgba(100,200,100,0.25); }

  .card-header { padding: 1rem 1.2rem; display: flex; align-items: center; gap: 0.9rem; }
  .horcrux-emoji { font-size: 1.8rem; flex-shrink: 0; width: 44px; text-align: center; }
  .horcrux-img-wrap {
    width: 44px; height: 44px; border-radius: 3px; overflow: hidden;
    border: 1px solid rgba(212,175,55,0.2); flex-shrink: 0;
    background: rgba(255,255,255,0.03); display: flex; align-items: center; justify-content: center;
  }
  .horcrux-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .horcrux-img-wrap img.loaded { display: block; }
  .card-meta { flex: 1; min-width: 0; }
  .card-riddle-num { font-family: var(--font-d); font-size: 0.52rem; letter-spacing: 0.2em; color: var(--gold); opacity: 0.6; text-transform: uppercase; }
  .card-title { font-family: var(--font-d); font-size: 0.78rem; font-weight: 700; color: var(--gold-lt); line-height: 1.3; margin-top: 0.1rem; }
  .status-badge { font-family: var(--font-d); font-size: 0.55rem; letter-spacing: 0.1em; padding: 0.22rem 0.55rem; border-radius: 2px; border: 1px solid; text-transform: uppercase; white-space: nowrap; }
  .badge-done { color: #5cb85c; border-color: #5cb85c; background: rgba(80,180,80,0.08); }
  .badge-active { color: var(--gold); border-color: var(--gold); background: rgba(212,175,55,0.08); }

  /* 완료 → 힌트 단어 표시 */
  .card-hint-reveal {
    padding: 0.7rem 1.2rem 0.9rem;
    border-top: 1px solid rgba(212,175,55,0.1);
    background: rgba(80,180,80,0.04);
  }
  .hint-reveal-label { font-family: var(--font-d); font-size: 0.5rem; letter-spacing: 0.2em; color: #5cb85c; opacity: 0.7; text-transform: uppercase; margin-bottom: 0.3rem; }
  .hint-reveal-word {
    font-family: var(--font-b); font-size: 1.4rem; letter-spacing: 0.05em;
    background: linear-gradient(90deg, #7ed87e, #a0f0a0);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  /* 활성 카드 미션 */
  .card-body { padding: 0 1.2rem 1.2rem; border-top: 1px solid rgba(212,175,55,0.1); }
  .mission-label { font-family: var(--font-d); font-size: 0.55rem; letter-spacing: 0.18em; color: var(--gold); opacity: 0.65; text-transform: uppercase; margin: 0.9rem 0 0.4rem; }
  .mission-q { font-size: 0.92rem; font-style: italic; line-height: 1.6; margin-bottom: 0.9rem; opacity: 0.85; }

  input[type="text"] {
    width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(212,175,55,0.25);
    border-radius: 3px; padding: 0.75rem 1rem; color: var(--parchment);
    font-family: var(--font-b); font-size: 1rem; outline: none; transition: border-color 0.2s; margin-bottom: 0.7rem;
  }
  input[type="text"]:focus { border-color: var(--gold); }
  .btn { font-family: var(--font-d); font-size: 0.7rem; letter-spacing: 0.15em; text-transform: uppercase; border: none; border-radius: 3px; padding: 0.75rem 1.4rem; cursor: pointer; transition: filter 0.2s; width: 100%; text-align: center; }
  .btn:hover { filter: brightness(1.15); }
  .btn-gold { background: linear-gradient(135deg, #8B6914, #C49A2A, #8B6914); color: var(--ink); font-weight: 700; }
  .error-msg { color: #ff6b6b; font-style: italic; font-size: 0.8rem; min-height: 1.1em; margin-top: 0.4rem; }
  .hint-toggle { font-family: var(--font-d); font-size: 0.58rem; letter-spacing: 0.1em; color: var(--gold); opacity: 0.45; cursor: pointer; text-transform: uppercase; background: none; border: none; padding: 0; margin-bottom: 0.4rem; display: block; transition: opacity 0.2s; }
  .hint-toggle:hover { opacity: 0.8; }
  .hint-text { font-style: italic; font-size: 0.8rem; opacity: 0.5; margin-bottom: 0.7rem; display: none; }
  .hint-text.visible { display: block; }

  /* ── 7번 최종 섹션 ── */
  .final-section {
    border: 1px solid rgba(212,175,55,0.4);
    border-radius: 4px; margin-top: 1.5rem; overflow: hidden;
    box-shadow: 0 0 30px rgba(212,175,55,0.08);
  }
  .final-section.locked { opacity: 0.3; pointer-events: none; }
  .final-header {
    background: linear-gradient(160deg, #2A1A04, #1A0E02);
    padding: 1rem 1.2rem; border-bottom: 1px solid rgba(212,175,55,0.2);
  }
  .final-riddle-num { font-family: var(--font-d); font-size: 0.52rem; letter-spacing: 0.2em; color: var(--gold); opacity: 0.6; text-transform: uppercase; }
  .final-title { font-family: var(--font-d); font-size: 1rem; color: var(--gold-lt); margin-top: 0.2rem; }
  .final-body { padding: 1.2rem; background: linear-gradient(160deg, #1E1408, #120C04); }

  /* 알파벳 타일 풀 */
  .letter-pool-label { font-family: var(--font-d); font-size: 0.52rem; letter-spacing: 0.2em; color: var(--gold); opacity: 0.6; text-transform: uppercase; margin-bottom: 0.6rem; }
  .letter-pool { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.5rem; padding: 0.8rem; background: rgba(212,175,55,0.04); border-radius: 3px; min-height: 52px; }
  .letter-tile {
    width: 30px; height: 34px;
    background: linear-gradient(180deg, #2A1F08, #1A1204);
    border: 1px solid rgba(212,175,55,0.3); border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-d); font-size: 0.95rem; font-weight: 700; color: var(--gold-lt);
  }
  .letter-tile.space-tile { width: 10px; background: transparent; border-color: transparent; }

  /* Tom Marvolo Riddle 표시 */
  .tom-riddle-hint {
    margin: 0.8rem 0 1rem;
    padding: 0.8rem 1rem;
    background: rgba(139,26,26,0.1); border: 1px solid rgba(139,26,26,0.3); border-radius: 3px;
    font-family: var(--font-d); font-size: 0.75rem; letter-spacing: 0.05em;
    color: #ff9999; text-align: center;
  }
  .tom-riddle-hint span { opacity: 0.5; font-size: 0.55rem; display: block; margin-bottom: 0.3rem; letter-spacing: 0.2em; text-transform: uppercase; }

  .locked-msg { font-style: italic; opacity: 0.5; font-size: 0.85rem; padding: 1rem; text-align: center; }

  /* 최종 완료 */
  .final-done-banner {
    text-align: center; padding: 2.5rem 1rem;
    background: rgba(212,175,55,0.06); border: 1px solid rgba(212,175,55,0.3);
    border-radius: 4px; margin-top: 1.5rem;
  }
  .final-done-banner h2 { font-family: var(--font-d); font-size: 1.3rem; color: var(--gold-lt); margin-bottom: 0.5rem; }
</style>
</head>
<body>

<header>
  <div>
    <div class="team-id" id="teamCode">—</div>
    <div class="team-name" id="teamName">팀 이름</div>
    <div class="house-tag" id="houseName">기숙사</div>
  </div>
  <a href="scoreboard.html" style="font-family:var(--font-d);font-size:0.6rem;letter-spacing:0.1em;color:var(--gold);opacity:0.45;text-decoration:none;text-transform:uppercase">점수판 →</a>
</header>

<div class="timer-bar">
  <span id="gameStatus">게임 대기 중</span>
  <span id="timerDisplay">80:00</span>
</div>

<div class="progress-track" id="progressTrack"></div>

<main id="mainContent"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
const TEAM_CODE = sessionStorage.getItem('hg_team');
if (!TEAM_CODE || !GAME_CONFIG.teams[TEAM_CODE]) window.location.href = 'index.html';

const TEAM = GAME_CONFIG.teams[TEAM_CODE];
const HOUSE = GAME_CONFIG.houses.find(h => h.id === TEAM.house);

document.getElementById('teamCode').textContent = TEAM_CODE;
document.getElementById('teamName').textContent = TEAM.displayName;
document.getElementById('houseName').textContent = HOUSE.emoji + ' ' + HOUSE.name;

// ── 타이머 ──────────────────────────────────────────────────
let timerInterval;
Store.onGameStarted(started => {
  if (started) {
    document.getElementById('gameStatus').textContent = '⚡ 게임 진행 중';
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      Store.getRemainingSeconds(rem => {
        const m = Math.floor(rem/60), s = Math.floor(rem%60);
        const el = document.getElementById('timerDisplay');
        el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        el.classList.toggle('urgent', rem < 300);
        if (rem <= 0) { document.getElementById('gameStatus').textContent = '🏁 게임 종료'; clearInterval(timerInterval); }
      });
    }, 1000);
  }
});

// ── 1번 자동 완료 ───────────────────────────────────────────
Store.getTeamState(TEAM_CODE, ts => {
  if (!ts?.stations?.[1]?.completed) {
    Store.completeStation(TEAM_CODE, 1, GAME_CONFIG.stations[0].maxScore);
  }
});

// ── 실시간 구독 ─────────────────────────────────────────────
Store.onTeamState(TEAM_CODE, ts => {
  renderProgress(ts);
  renderMain(ts);
});

// ── 진행 트랙 ───────────────────────────────────────────────
function renderProgress(ts) {
  let html = '';
  GAME_CONFIG.stations.forEach((st, i) => {
    const done = ts?.stations?.[st.id]?.completed;
    if (i > 0) html += `<div class="progress-line"></div>`;
    html += `<div class="progress-pip ${done ? 'done' : ''}">${done ? '✓' : i+1}</div>`;
  });
  document.getElementById('progressTrack').innerHTML = html;
}

// ── 메인 렌더 ───────────────────────────────────────────────
function renderMain(ts) {
  const completedIds = new Set(
    Object.entries(ts?.stations || {}).filter(([,v]) => v.completed).map(([k]) => Number(k))
  );
  const allSixDone = [1,2,3,4,5,6].every(id => completedIds.has(id));
  const finalDone = completedIds.has(7);

  if (finalDone) {
    document.getElementById('mainContent').innerHTML = `
      <div class="final-done-banner">
        <div style="font-size:3.5rem;margin-bottom:1rem">🏆</div>
        <h2>볼드모트를 무찔렀습니다!</h2>
        <p style="font-family:var(--font-d);font-size:0.75rem;color:var(--gold);margin-top:0.8rem;letter-spacing:0.1em">SAENURI UNPLUGGED CONFERENCE</p>
      </div>`;
    return;
  }

  let html = '';

  // 1~6번 카드
  GAME_CONFIG.stations.slice(0, 6).forEach(st => {
    const done = completedIds.has(st.id);

    if (done) {
      const imgHtml = st.image
        ? `<div class="horcrux-img-wrap"><img src="${st.image}" onload="this.classList.add('loaded')"><span style="position:absolute">${st.emoji}</span></div>`
        : `<div class="horcrux-emoji">${st.emoji}</div>`;
      html += `<div class="horcrux-card done">
        <div class="card-header">
          ${imgHtml}
          <div class="card-meta">
            <div class="card-riddle-num">${st.riddleNum}</div>
            <div class="card-title">${st.title}</div>
          </div>
          <span class="status-badge badge-done">✓ 파괴됨</span>
        </div>
        <div class="card-hint-reveal">
          <div class="hint-reveal-label">해독된 단어</div>
          <div class="hint-reveal-word">${st.hint}</div>
        </div>
      </div>`;
      return;
    }

    // 미완료 (활성)
    const imgHtml = st.image
      ? `<div class="horcrux-img-wrap"><img src="${st.image}" onload="this.classList.add('loaded')"><span style="position:absolute">${st.emoji}</span></div>`
      : `<div class="horcrux-emoji">${st.emoji}</div>`;
    const m = st.missions?.[0] || {};
    html += `<div class="horcrux-card active">
      <div class="card-header">
        ${imgHtml}
        <div class="card-meta">
          <div class="card-riddle-num">${st.riddleNum}</div>
          <div class="card-title">${st.title}</div>
        </div>
        <span class="status-badge badge-active">진행 중</span>
      </div>
      <div class="card-body">
        ${m.question ? `<div class="mission-label">수수께끼</div><p class="mission-q">${m.question}</p>` : ''}
        ${m.hint ? `<button class="hint-toggle" onclick="toggleHint(this)">💡 힌트 보기</button><p class="hint-text">${m.hint}</p>` : ''}
        <input type="text" id="quiz-${st.id}" placeholder="정답 입력" autocomplete="off" inputmode="numeric">
        <button class="btn btn-gold" onclick="submitQuiz(${st.id})">호크룩스 파괴 ⚡</button>
        <p class="error-msg" id="err-${st.id}"></p>
      </div>
    </div>`;
  });

  // 7번 최종 섹션
  const finalSt = GAME_CONFIG.stations[6];
  if (allSixDone) {
    const letters = buildLetterPool();
    html += `<div class="final-section">
      <div class="final-header">
        <div class="final-riddle-num">${finalSt.riddleNum}</div>
        <div class="final-title">${finalSt.emoji} ${finalSt.title}</div>
      </div>
      <div class="final-body">
        <div class="letter-pool-label">해독된 알파벳</div>
        <div class="letter-pool">${letters}</div>
        <div class="tom-riddle-hint">
          <span>아나그램 힌트</span>
          Tom Marvolo Riddle
        </div>
        <input type="text" id="finalInput" placeholder="정답 입력 (대소문자 구분)" autocomplete="off">
        <button class="btn btn-gold" onclick="submitFinal()">볼드모트를 무찔러라 ⚡</button>
        <p class="error-msg" id="finalErr"></p>
      </div>
    </div>`;
  } else {
    const remaining = [1,2,3,4,5,6].filter(id => !completedIds.has(id)).length;
    html += `<div class="final-section locked">
      <div class="final-header">
        <div class="final-riddle-num">${finalSt.riddleNum}</div>
        <div class="final-title">${finalSt.emoji} ${finalSt.title}</div>
      </div>
      <div class="final-body">
        <p class="locked-msg">🔒 호크룩스 ${remaining}개를 더 파괴해야 잠금이 해제됩니다</p>
      </div>
    </div>`;
  }

  document.getElementById('mainContent').innerHTML = html;
}

// ── 알파벳 풀 (힌트 단어들 셔플) ───────────────────────────
function buildLetterPool() {
  const hints = GAME_CONFIG.stations.slice(0, 6).map(s => s.hint).join('');
  let letters = hints.split('');
  // 시드 기반 셔플 (팀마다 다르게)
  const seed = TEAM_CODE.split('').reduce((a,c) => a + c.charCodeAt(0), 42);
  for (let i = letters.length - 1; i > 0; i--) {
    const j = Math.abs((seed * 31 + i * 17) % (i + 1));
    [letters[i], letters[j]] = [letters[j], letters[i]];
  }
  return letters.map(ch =>
    `<div class="letter-tile">${ch}</div>`
  ).join('');
}

// ── 핸들러 ──────────────────────────────────────────────────
function toggleHint(btn) {
  const hint = btn.nextElementSibling;
  hint.classList.toggle('visible');
  btn.textContent = hint.classList.contains('visible') ? '💡 힌트 숨기기' : '💡 힌트 보기';
}

function submitQuiz(stationId) {
  const val = document.getElementById(`quiz-${stationId}`)?.value.trim();
  const err = document.getElementById(`err-${stationId}`);
  if (!val) { if(err) err.textContent = '정답을 입력해 주세요.'; return; }
  const station = GAME_CONFIG.stations.find(s => s.id === stationId);
  if (val === station.answer) {
    Store.completeStation(TEAM_CODE, stationId, station.maxScore);
  } else {
    if(err) err.textContent = '틀렸습니다. 다시 시도해 보세요.';
  }
}

function submitFinal() {
  const val = document.getElementById('finalInput')?.value.trim();
  const err = document.getElementById('finalErr');
  if (!val) { if(err) err.textContent = '정답을 입력해 주세요.'; return; }
  const finalStation = GAME_CONFIG.stations[6];
  if (val === finalStation.answer) {
    Store.completeStation(TEAM_CODE, 7, finalStation.maxScore);
  } else {
    if(err) err.textContent = '틀렸습니다. 대소문자를 확인하세요.';
  }
}
</script>
</body>
</html>
