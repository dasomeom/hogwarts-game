<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>점수판 — 해리포터와 새누리의 비밀</title>
<link rel="icon" href="images/harry.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold:#8BA4D4; --gold-lt:#C0D4F0; --parchment:#D8E4F5;
    --ink:#0A0F1A; --deep:#050308;
    --font-d:'Cinzel',serif; --font-b:'Crimson Text',Georgia,serif;
  }
  body { background:var(--deep); color:var(--parchment); font-family:var(--font-b); min-height:100vh; position:relative; }
  #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  header, .houses-section, .teams-section { position: relative; z-index: 2; }

  @keyframes float-up {
    0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(-100vh) translateX(var(--dx)) scale(0.3); opacity: 0; }
  }
  .particle {
    position: fixed; bottom: -10px; width: 3px; height: 3px; border-radius: 50%;
    background: var(--gold); pointer-events: none; z-index: 1;
    animation: float-up var(--dur) ease-in infinite; animation-delay: var(--delay);
    opacity: 0; --dx: 0px;
  }

  /* ── 헤더 ── */
  header {
    background:linear-gradient(180deg,#080C18,#050308);
    border-bottom:1px solid rgba(140,164,212,0.2);
    padding:1.2rem 2rem; text-align:center;
    position:relative;
  }
  header h1 { font-family:var(--font-d); font-size:clamp(1.2rem,4vw,2rem); color:var(--gold-lt); letter-spacing:0.1em; }
  header p { font-size:0.8rem; opacity:0.5; margin-top:0.2rem; font-style:italic; }
  .back-btn {
    position:absolute; left:1rem; top:50%; transform:translateY(-50%);
    font-family:var(--font-d); font-size:0.65rem; letter-spacing:0.1em;
    color:var(--gold); opacity:0.6; text-decoration:none; text-transform:uppercase;
    transition:opacity 0.2s;
  }
  .back-btn:hover { opacity:1; }
  #globalTimer {
    position:absolute; right:1.5rem; top:50%; transform:translateY(-50%);
    font-family:var(--font-d); font-size:1.4rem; color:var(--gold-lt);
    text-shadow:0 0 15px rgba(140,164,212,0.4);
  }
  #globalTimer.urgent { color:#ff6b6b; }

  /* ── 기숙사 점수 ── */
  .houses-section { padding:1.5rem 1.5rem 0.5rem; max-width:900px; margin:0 auto; }
  .section-label { font-family:var(--font-d); font-size:0.65rem; letter-spacing:0.2em; color:var(--gold); opacity:0.5; text-transform:uppercase; margin-bottom:1rem; }
  .houses-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; }
  @media(min-width:600px) { .houses-grid { grid-template-columns:repeat(4,1fr); } }

  .house-card {
    padding:1.2rem; border-radius:4px; text-align:center;
    border:1px solid rgba(255,255,255,0.1);
    position:relative; overflow:hidden;
    transition:transform 0.3s;
  }
  .house-card.rank-1 { border-color:var(--gold); box-shadow:0 0 20px rgba(140,164,212,0.2); }
  .house-card .emoji { font-size:2rem; display:block; margin-bottom:0.4rem; }
  .house-card .h-name { font-family:var(--font-d); font-size:0.7rem; letter-spacing:0.1em; opacity:0.7; text-transform:uppercase; }
  .house-card .h-score { font-family:var(--font-d); font-size:2rem; font-weight:700; color:var(--gold-lt); margin:0.3rem 0; }
  .house-card .h-rank { font-size:0.75rem; opacity:0.5; }
  .crown { position:absolute; top:0.5rem; right:0.7rem; font-size:1rem; }

  /* ── 팀 순위표 ── */
  .teams-section { padding:1.2rem 1.5rem 4rem; max-width:900px; margin:0 auto; }
  .leaderboard { border:1px solid rgba(140,164,212,0.15); border-radius:4px; overflow:hidden; }
  .lb-row {
    display:grid; grid-template-columns:2.5rem 1fr 5rem 4rem;
    align-items:center; gap:0.5rem;
    padding:0.85rem 1rem;
    border-bottom:1px solid rgba(255,255,255,0.05);
    transition:background 0.2s;
  }
  .lb-row:last-child { border-bottom:none; }
  .lb-row:hover { background:rgba(140,164,212,0.04); }
  .lb-row.rank-1 { background:rgba(140,164,212,0.08); }
  .lb-row.rank-2 { background:rgba(192,192,192,0.05); }
  .lb-row.rank-3 { background:rgba(205,127,50,0.05); }

  .lb-rank { font-family:var(--font-d); font-size:0.85rem; font-weight:700; text-align:center; }
  .rank-1 .lb-rank { color:var(--gold); }
  .rank-2 .lb-rank { color:#C0C0C0; }
  .rank-3 .lb-rank { color:#CD7F32; }

  .lb-team {}
  .lb-team-name { font-family:var(--font-d); font-size:0.8rem; }
  .lb-team-house { font-size:0.75rem; opacity:0.5; font-style:italic; }

  .lb-stations { font-size:0.8rem; opacity:0.5; text-align:center; }
  .lb-score { font-family:var(--font-d); font-size:1.1rem; font-weight:700; color:var(--gold-lt); text-align:right; }

  /* ── 갱신 표시 ── */
  .refresh-note { text-align:center; font-size:0.75rem; opacity:0.3; font-style:italic; margin-top:1.5rem; }

  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
  .lb-row { animation:fadeIn 0.3s ease both; }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<header>
  <a class="back-btn" href="index.html">← 홈</a>
  <h1>🏆 실시간 점수판</h1>
  <p id="lastUpdated">자동 갱신 중…</p>
  <span id="globalTimer">—:--</span>
</header>

<div class="houses-section">
  <p class="section-label">기숙사 점수</p>
  <div class="houses-grid" id="housesGrid"></div>
</div>

<div class="teams-section">
  <p class="section-label" style="margin-bottom:1rem">팀 순위</p>
  <div class="leaderboard" id="leaderboard"></div>
  <p class="refresh-note">5초마다 자동으로 새로고침됩니다</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="config.js?v=5"></script>
<script src="store.js?v=5"></script>
<script>
function render() {
  Store.onLeaderboard(({ teams, houseScores }) => {
    // ── 타이머 ────────────────────────────────────────────────
    const timerEl = document.getElementById('globalTimer');
    Store.isGameStarted(started => {
      if (started) {
        Store.getRemainingSeconds(rem => {
          const m = Math.floor(rem/60), s = Math.floor(rem%60);
          timerEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
          timerEl.classList.toggle('urgent', rem < 300);
        });
      } else {
        timerEl.textContent = '대기 중';
      }
    });

    // ── 기숙사 ───────────────────────────────────────────────
    const sortedHouses = [...GAME_CONFIG.houses].sort((a,b) => houseScores[b.id] - houseScores[a.id]);
    document.getElementById('housesGrid').innerHTML = sortedHouses.map((h, i) => `
      <div class="house-card rank-${i+1}" style="background:linear-gradient(160deg,${h.color}33,${h.color}11)">
        ${i === 0 ? '<span class="crown">👑</span>' : ''}
        <span class="emoji">${h.emoji}</span>
        <div class="h-name">${h.name}</div>
        <div class="h-score">${houseScores[h.id]}</div>
        <div class="h-rank">${['🥇 1위','🥈 2위','🥉 3위','4위'][i]}</div>
      </div>
    `).join('');

    // ── 팀 순위 ──────────────────────────────────────────────
    document.getElementById('leaderboard').innerHTML = teams.map((t, i) => {
      const house = GAME_CONFIG.houses.find(h => h.id === t.house);
      const rankStr = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}`;
      return `<div class="lb-row rank-${i+1}">
        <div class="lb-rank">${rankStr}</div>
        <div class="lb-team">
          <div class="lb-team-name">${t.displayName}</div>
          <div class="lb-team-house">${house?.name}</div>
        </div>
        <div class="lb-stations">${t.stationsCompleted} / ${GAME_CONFIG.stations.length} 완료</div>
        <div class="lb-score">${t.total}점</div>
      </div>`;
    }).join('');

    document.getElementById('lastUpdated').textContent = `마지막 갱신: ${new Date().toLocaleTimeString('ko-KR')}`;
  });
}

render();
setInterval(render, 5000);

// ── 배경 — 별 + 파티클 ───────────────────────────────────────
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [], t = 0;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({length: 150}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.4 + 0.1,
      speed: Math.random() * 0.006 + 0.001,
      phase: Math.random() * Math.PI * 2,
      color: Math.random() > 0.8 ? [180,200,255] : [240,220,160],
    }));
  }

  function draw(ts) {
    t = ts * 0.001;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const grad = ctx.createRadialGradient(
      canvas.width*0.5, canvas.height*0.3, 0,
      canvas.width*0.5, canvas.height*0.5, canvas.width*0.8
    );
    grad.addColorStop(0, 'rgba(15,10,30,1)');
    grad.addColorStop(0.5, 'rgba(5,3,12,1)');
    grad.addColorStop(1, 'rgba(2,1,5,1)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      const alpha = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * s.speed * 60 + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${s.color[0]},${s.color[1]},${s.color[2]},${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();

for (let i = 0; i < 18; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.cssText = `
    left: ${Math.random()*100}%;
    --dur: ${4 + Math.random()*6}s;
    --delay: ${Math.random()*8}s;
    --dx: ${(Math.random()-0.5)*80}px;
    width: ${1+Math.random()*2}px;
    height: ${1+Math.random()*2}px;
    background: ${Math.random() > 0.5 ? '#8BA4D4' : '#C0D4F0'};
    opacity: ${0.3+Math.random()*0.4};
  `;
  document.body.appendChild(p);
}
</script>
</body>
</html>
